[workspace]
resolver = "2"
members = ["crates/common", "crates/control", "crates/loader", "crates/pg-sink", "crates/pg-to-arrow", "tests/e2e"] # grows one crate at a time, following the DAG in docs/implementation/README.md

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.95" # MSRV — keep in sync with rust-toolchain.toml; CI `msrv` job fails on drift (PR 4.7)

# Lint-as-policy, centralised so no member crate can silently opt out of `deny(warnings)`.
# NOTE: these only take effect in a member once it declares `[lints] workspace = true`.
[workspace.lints.rust]
warnings = "deny"
# Every public type must format under `{:?}` for diagnostics and tracing. This rustc lint is
# allow-by-default, so the warnings group does not enable it (PR 13.1).
missing_debug_implementations = "deny"
# The rustc `unsafe-code` lint is allow-by-default, so `warnings = "deny"` never reaches it.
# `forbid` prevents a member from reopening the door with an allow attribute; walrus has no sites.
unsafe_code = "forbid"
# This compatibility lint is allow-by-default in edition 2021 and warn-by-default in edition 2024;
# the workspace warning deny would then make it an error. Deny it now as a staged migration step.
unsafe_op_in_unsafe_fn = "deny"
# walrus authors no extern blocks. Its configured native engine is dependency-owned: `duckdb` with
# `bundled` (crates/loader/Cargo.toml:23; crates/pg-to-arrow/Cargo.toml:30) compiles C++ and generated
# declarations in pinned `libduckdb-sys`. Other dependency FFI is likewise not first-party. This
# lint is allow-by-default here, so deny it explicitly to reject pre-2024 extern-block spelling.
missing_unsafe_on_extern = "deny"
# The tree has no no_mangle/export_name/link_section attributes and declares no custom crate type;
# its production artifacts are the walrus-pg-sink and walrus-loader executables. Deny the otherwise
# allow-by-default bare spelling because duplicate exported symbols can create linker-level UB.
unsafe_attr_outside_unsafe = "deny"
# This rustc lint is allow-by-default, so `warnings = "deny"` does not enable it.
missing_copy_implementations = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# Pure public computations must warn when their returned value is discarded. This pedantic lint is
# outside `clippy::all`, so it needs no group priority adjustment (PR 13.2).
must_use_candidate = "deny"
# A consuming builder's `-> Self` is worthless if dropped. This pedantic lint is outside
# `clippy::all`, so it needs no group priority adjustment (PR 13.9).
return_self_not_must_use = "deny"
# Named explicitly (PR 13.4) so the rule survives a future regrouping of `clippy::all`.
from_over_into = "deny"
# `ptr_arg` already arrives via `all = "deny"`; pin it explicitly so the borrowed-argument family is
# documented together. `ref_option` is pedantic (outside `all`), so no priority juggling is needed.
ptr_arg = "deny"
ref_option = "deny"
# `assigning_clones` is pedantic (outside `all`), so no priority juggling is needed.
assigning_clones = "deny"
# `push_str(&format!(..))` allocates a temporary just to copy it into an existing buffer. This is a
# restriction lint (outside `all`), so no priority juggling is needed.
format_push_string = "deny"
# Pedantic: keep small `Copy` values passed by value once the rustc lint above finds them.
trivially_copy_pass_by_ref = "deny"
# No `unwrap`/`expect` in production (PR 7.6 cleaned the tree). Both are `clippy::restriction` lints
# (not in `all`), so no `priority` juggling is needed. `clippy.toml` re-allows them under `#[cfg(test)]`
# and integration `tests/`; benches (`harness = false`) and the e2e harness lib carry a file-level allow.
unwrap_used = "deny"
expect_used = "deny"
# Belt-and-braces if a future crate deliberately stops inheriting the rustc forbid above: every
# unsafe block must carry a `// SAFETY:` comment. This is a restriction lint outside `clippy::all`,
# so no group-vs-lint priority is needed.
undocumented_unsafe_blocks = "deny"
# Keep each unsafe block to one auditable invariant. This is another restriction lint outside
# `clippy::all`, so it needs no group-vs-lint priority.
multiple_unsafe_ops_per_block = "deny"
# A suppression must say why. This restriction lint is outside `clippy::all`, so no priority is needed.
allow_attributes_without_reason = "deny"
# Promoting exactly this pedantic lint keeps every fallible public API's contract explicit.
missing_errors_doc = "deny"
panic = "deny"              # a service returns a classified error instead of aborting the pod
todo = "deny"               # unfinished code must not reach main
unimplemented = "deny"      # the one deferred stub carries a scoped, fulfilled expectation
unreachable = "deny"        # exhaustive matches turn impossible states into compile-time checks
panic_in_result_fn = "deny" # a function that can return failure must not panic instead
# Lock scope is a correctness property on the decode hot path (PR 9.11, `own-mutex-interior`):
# matching directly on `self.x.lock().remove(..)` holds the guard for the whole body. These nursery
# lints are outside `clippy::all`, so no priority is needed.
significant_drop_in_scrutinee = "deny"
significant_drop_tightening = "deny"
# Shared-ownership bumps must say they are bumps (PR 9.8, `own-arc-shared`). Like `unwrap_used` /
# `expect_used`, this is one `clippy::restriction` lint rather than the whole group; it is outside
# `clippy::all`, so no `priority` is needed.
clone_on_ref_ptr = "deny"
# No refcounted pointer to a growable buffer (PR 9.9, `own-rc-single-thread`): `Rc<Vec<T>>` /
# `Arc<String>` add an indirection where `Rc<[T]>` / `Arc<str>` are one. Like `unwrap_used` and
# `expect_used`, this is one `clippy::restriction` lint outside `clippy::all`, so no priority.
rc_buffer = "deny"
# Large-value gates (PR 9.7, `own-move-large`). All four measured 0 sites across the 51-lint
# pedantic+nursery sweep, so they only stop regressions on the per-WAL-message move path. They are
# outside `clippy::all`, so no `priority` field is needed.
large_types_passed_by_value = "deny"
large_stack_arrays = "deny"
large_stack_frames = "deny"
large_futures = "deny"
# `redundant_clone` is nursery and `implicit_clone` is pedantic; neither is in `all`, so no priority juggling is needed.
redundant_clone = "deny"
implicit_clone = "deny"
# Nursery (outside `clippy::all`, so no `priority` juggling): flags a lifetime that must exist but
# need not be named. Its coarser sibling `needless_lifetimes` already arrives through `all`.
elidable_lifetime_names = "deny"

[workspace.dependencies]
# Shared version pins land here as later PRs add deps (tracing, sqlx, arrow, …).
thiserror = "2"
serde = "1"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
figment = "0.10"
humantime-serde = "1"
jiff = "0.2"
bytes = "1"
tokio = "1"
sqlx = "0.8"
anyhow = "1"
hex = "0.4"
# Non-poisoning mutex (PR 7.6): `.lock()` returns the guard directly, so there is no `unwrap`/`expect`
# on the lock — the clean fit for the `clippy::unwrap_used`/`expect_used` deny (PR 7.7). Already in the
# lock file (transitive), MIT/Apache: a zero-cost direct-dep promotion.
parking_lot = "0.12"
# Pinned to EXACT versions (PR 2.16): DuckDB reads a native `UUID` only when arrow-rs annotates the
# FixedSizeBinary(16) with the `arrow.uuid` canonical extension → Parquet UUID logical type. That
# annotation is behaviour a minor bump could change, so the (CI-guarded) uuid mapping pins arrow +
# parquet, and duckdb is pinned alongside for a stable read-back. §2.4 uuid.
arrow = "=54.3.1"
parquet = "=54.3.1"
# `1.10504.0` encodes DuckDB engine v1.5.4 (duckdb-rs scheme since v1.5.0: minor=(N/100)%100,
# patch=N%100). Latest published duckdb-rs, already past the 1.4.x LTS — see the LTS evaluation in
# docs/implementation/notes/duckdb-lts-bump.md (PR 5.9).
duckdb = "=1.10504.0"
uuid = "1"
tempfile = "3"
# Sink binary (PR 2.18): health endpoints, cancellation, object-store canary.
axum = "0.7"
tokio-util = "0.7"
object_store = "0.11"
# Replication-capable source connection + catalog preflight (PR 2.19); START_REPLICATION (PR 2.20).
tokio-postgres = "0.7"
# Hand-rolled replication wire protocol (PR 2.20): big-endian LSNs / clocks in CopyBoth frames.
byteorder = "1"
# Observability (PR 4.10): a metrics facade + a Prometheus recorder. default-features off — we render
# the text exposition through the existing axum health server, not the crate's own hyper listener.
metrics = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false }
# Micro-benchmark harness (PR 5.4). default-features off drops plotters/rayon/html_reports — we want
# the stdout stats, not the HTML plots, and a lean dev-dep tree (this phase is about *cutting* build
# cost). `cargo_bench_support` is what makes `harness = false` + `criterion_main!` run under `cargo bench`.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# Release-artifact tuning (PR 5.7). Thin LTO inlines across crate boundaries — a real win on the
# dispatch-heavy hot paths (Arrow `append_value` downcasts, the decoder match arms) for ~10-20 % extra
# link time, measured on the PR 5.4 suite. `codegen-units` is left at the default: cgu=1 buys only a
# few percent more for ~2× the release build — a bad trade for a project whose Phase-5 north star is
# *cutting* CI/Docker build time (PRs 5.1-5.3), and the bench inherits `release` so the numbers count.
[profile.release]
lto = "thin"
