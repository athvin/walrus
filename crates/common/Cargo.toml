[package]
name = "common"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true # internal component; the workspace bar keeps it off every registry

[lints]
workspace = true # inherit deny(warnings) + clippy::all from the workspace root

[features]
# Opt-in sqlx `Type`/`Encode`/`Decode` for `Lsn` <-> Postgres `pg_lsn` (delegating to sqlx's
# PgLsn). Off by default so non-DB consumers of `common` don't pull sqlx; `control`/`loader` enable it.
sqlx = ["dep:sqlx"]

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# SinkMeta's amortized split-serialization (PR 5.7) renders the meta JSON fragments in production.
serde_json = { workspace = true }
tracing = { workspace = true }
# `tracing-log` is a default feature, named here to make it a contract rather than an accident: it
# is what makes `SubscriberInitExt::try_init` install the `log` -> `tracing` bridge, so the records
# tokio-postgres / sqlx / reqwest still emit through the `log` facade reach our subscriber. A future
# `default-features = false` would otherwise silence them with no compile error.
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "json",
    "tracing-log",
] }
figment = { workspace = true, features = ["env", "toml", "yaml"] }
humantime-serde = { workspace = true }
# jiff over `time`: jiff::Timestamp is inherently a UTC instant and Displays as RFC-3339 with a
# `Z` suffix, so UtcTimestamp cannot accidentally emit a local/offset datetime.
jiff = { workspace = true }
bytes = { workspace = true }
# Observability (PR 4.10): the `metrics` facade (call-site macros are no-ops until a recorder is
# installed) + the Prometheus recorder whose handle renders the /metrics text exposition.
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
sqlx = { workspace = true, optional = true, features = [
    "runtime-tokio",
    "postgres",
] }

[dev-dependencies]
# `test` feature adds figment::Jail for hermetic env/file config tests (dev-only).
figment = { workspace = true, features = ["test"] }
# Generated LSN positions for the `Lsn` properties in src/lsn_test.rs. Dev-only by construction:
# `common` is a library, so nothing a walrus binary links can reach a test-profile dependency.
proptest = { workspace = true }
